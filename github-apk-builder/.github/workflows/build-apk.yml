name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-android-apk:
    name: Build & Generate APK
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 📦 Install Capacitor and build web dist
        run: |
          npm install
          npm run build

      - name: ☕ Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 📱 Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: ⚡ Initialize Android Native Platform
        run: |
          npx cap add android
          npx cap sync android

      - name: 🔧 Grant execute permission to Gradle wrapper
        run: chmod +x android/gradlew

      - name: 🔨 Compile Android Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon

      - name: 📦 Collect APK Artifact
        run: |
          mkdir -p output
          cp android/app/build/outputs/apk/debug/app-debug.apk output/ShopManager.apk

      - name: 🚀 Upload APK for Instant Download
        uses: actions/upload-artifact@v4
        with:
          name: ShopManager-APK
          path: output/ShopManager.apk
          retention-days: 60
